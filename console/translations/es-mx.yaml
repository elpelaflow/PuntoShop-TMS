    processed-retention-hours: Conservar entregas procesadas por (horas)
    processed-retention-hours-help: Los lotes de proveedores sin procesar se almacenan cifrados hasta que se procesan y se conservan brevemente para reproducción y diagnósticos. Cada lote puede tener cerca de un megabyte.
    quarantine-retention-days: Conservar entregas en cuarentena por (días)
    quarantine-retention-days-help: Los lotes que no pudieron procesarse permanecen disponibles para inspección y reproducción durante este tiempo.
    sync-run-retention-days: Conservar diagnósticos de sincronización por (días)
    sync-run-retention-days-help: Se registra una fila de ejecución de sincronización por conexión por sondeo. Las ejecuciones en curso nunca se eliminan.
