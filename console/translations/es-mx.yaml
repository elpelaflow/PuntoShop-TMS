    storage-usage: Uso de almacenamiento de telemática
    storage-usage-desc: El uso de almacenamiento incluye datos de telemática de todas las organizaciones. La limpieza se aplica a nivel de todo el sistema, utilizando la política del sistema guardada y las preferencias de historial de cada organización dentro de esa política.
