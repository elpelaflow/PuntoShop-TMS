    event-retention-days-help: Los eventos anteriores a este plazo se eliminarán de forma permanente. Se aplica tanto a las actualizaciones de telemetría como a las alertas de proveedores.
    event-compact-after-days: Descartar cargas útiles sin procesar después de (días)
    event-compact-after-days-help: Los eventos anteriores a este plazo conservan su tipo, gravedad, ubicación y datos normalizados, pero se elimina la carga útil original del proveedor. Las cargas útiles sin procesar constituyen la mayor parte del tamaño de cada evento.
    compaction-warning: Las cargas útiles sin procesar solo se eliminan de los eventos conservados. Establezca este valor por debajo de la retención de eventos o en 0 para desactivar la compactación.
    positions: Retención del historial de posiciones
    position-retention-days: Conservar posiciones por (días)
    position-retention-days-help: El historial de posiciones de vehículos y remolques anterior a este plazo se elimina permanentemente. La reproducción de rutas y las vistas del historial solo se remontan hasta este límite.
