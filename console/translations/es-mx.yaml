    settings-unavailable: No se pudo cargar la configuración de telemática. Inténtelo de nuevo.
    admin-info: Configure la política de retención de telemática y el registro de actividad para todas las organizaciones. Las organizaciones pueden elegir la retención del historial de eventos de dispositivos y posiciones dentro de estos límites desde Fleet-Ops › Configuración › Telemática. Un valor máximo tiene prioridad sobre las preferencias de la organización, los valores predeterminados heredados y las solicitudes de mantener el historial para siempre. Reducir un máximo puede eliminar el historial existente en la próxima limpieza.
