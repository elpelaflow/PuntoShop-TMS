    refresh: Actualizar
    run-cleanup: Ejecutar limpieza del sistema
    run-cleanup-confirm: Esto pone en cola la limpieza de telemática en todas las organizaciones, utilizando la política del sistema guardada y las preferencias de historial de cada organización. Los registros vencidos se eliminan permanentemente y no se pueden recuperar. ¿Desea continuar?
    cleanup-queued: Se ha puesto en cola la limpieza de telemática en todas las organizaciones. El uso se actualizará en breve; la limpieza aún puede estar ejecutándose.
    cleanup-unavailable: No se pudo confirmar la limpieza de telemática del sistema. Inténtelo de nuevo.
    usage-unavailable: No se pudo cargar el uso de almacenamiento. Seleccione Actualizar para intentarlo de nuevo.
    space-reclaim-note: El uso incluye todos los datos de telemática del sistema. Los conteos de filas marcados como estimados utilizan estadísticas de la base de datos. Los tamaños incluyen datos de tablas e índices. La eliminación de registros libera espacio para su reutilización dentro de la base de datos; el uso de disco físico puede no disminuir de inmediato.
